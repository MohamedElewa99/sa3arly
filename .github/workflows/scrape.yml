name: scrape

# Every run reads every list page of every source to its end: no page limit (Hatla2ee ~205 pages, ~40 min).
#   daily  03:17 Cairo : Hatla2ee zero prices, then all of Hatla2ee used (+300 ad pages for new ads), all of OpenSooq, all of Sylndr
#   daily  15:17 Cairo : all three used sources again, for the day's new ads
#   Friday 05:17 Cairo : the list of models per brand
#   a source that returns no ads at all fails its job, so GitHub emails the owner
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
    - cron: "17 3 * * 5"
  workflow_dispatch:
    inputs:
      job: { description: "daily, weekly, or one command (e.g. models)", default: "daily" }

concurrency: { group: scrape, cancel-in-progress: false }

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 1          # one request stream at a time to Hatla2ee
      matrix:
        job: ${{ (github.event.schedule == '17 3 * * 5' || inputs.job == 'weekly')
                 && fromJSON('["models"]')
                 || (inputs.job && inputs.job != 'daily') && fromJSON(format('["{0}"]', inputs.job))
                 || github.event.schedule == '17 13 * * *'
                 && fromJSON('["used --source hatla2ee --max-details 300", "used --source opensooq", "used --source sylndr"]')
                 || fromJSON('["zero --source hatla2ee", "used --source hatla2ee --max-details 300", "used --source opensooq", "used --source sylndr"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-scraper.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
      - name: scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sa3arly ${{ matrix.job }}

  # after every scrape: retrain the AI price model on the fresh ads (a few minutes on the free runner)
  train:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-train.txt
      - name: train
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sa3arly train
