name: scrape

# Hatla2ee answers a page in ~10 s, so work is split:
#   daily  03:17 Cairo : Hatla2ee zero prices + newest 60 used pages (+300 ad pages), all of OpenSooq and Sylndr (~3.5 h, one job after the other)
#   Friday 05:17 Cairo : full sweep of every list page, no ad pages (prices + removals) (~3.5 h)
on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 3 * * 5"
  workflow_dispatch:
    inputs:
      job: { description: "daily, weekly, or one command (e.g. models)", default: "daily" }

concurrency: { group: scrape, cancel-in-progress: false }

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 1          # one request stream at a time to Hatla2ee
      matrix:
        job: ${{ (github.event.schedule == '17 3 * * 5' || inputs.job == 'weekly')
                 && fromJSON('["used --source hatla2ee --max-pages 800 --max-details 0", "models", "trims --max-pages 1500"]')
                 || (inputs.job && inputs.job != 'daily') && fromJSON(format('["{0}"]', inputs.job))
                 || fromJSON('["zero --source hatla2ee", "used --source hatla2ee --max-pages 60 --max-details 300", "used --source opensooq --max-pages 60", "used --source sylndr --max-pages 40"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-scraper.txt && python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests
      - name: scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sa3arly ${{ matrix.job }}

  # after every scrape: retrain the AI price model on the fresh ads (a few minutes on the free runner)
  train:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-train.txt
      - name: train
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m sa3arly train
