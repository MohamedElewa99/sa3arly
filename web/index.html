<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سعرلي — اعرف تمن العربية قبل ما تدفع</title>
  <meta name="description" content="سعرلي بيسعّر العربية المستعملة في مصر من الإعلانات الحقيقية وحالة الدهان والميكانيكا.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F6F7" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سعرلي">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600&family=Aref+Ruqaa:wght@400;700&display=swap">
  <script src="/sa3-three.js" defer></script>
  <style>
    /* first paint: a plain black or white page (follows the phone's dark mode) while سعرلي writes itself */
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      background: #000; color: #F4F4F4; transition: opacity .5s ease, visibility .5s; }
    @media (prefers-color-scheme: light) { #splash { background: #F5F6F7; color: #000; } }
    #splash.light { background: #F5F6F7; color: #000; }
    #splash.dark { background: #000; color: #F4F4F4; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash > svg { width: min(64vw, 360px); overflow: visible; clip-path: inset(-20% 0 -20% 100%);
      animation: wm-reveal 1.5s cubic-bezier(.65,.05,.36,1) .1s forwards; }
    #splash > svg path { fill: currentColor; fill-opacity: 0; stroke: currentColor; stroke-width: 7; stroke-linejoin: round;
      animation: wm-fill .6s ease 1.1s forwards; }
    #splash > i { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #E3232C; top: 50%; right: calc(50% - min(32vw, 180px));
      opacity: 0; animation: wm-pen 1.5s cubic-bezier(.65,.05,.36,1) .1s forwards; }
    @keyframes wm-reveal { to { clip-path: inset(-20% 0 -20% 0); } }
    @keyframes wm-fill { to { fill-opacity: 1; stroke-width: 0; } }
    @keyframes wm-pen { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 90% { opacity: 1; }
      100% { opacity: 0; transform: translateX(calc(-1 * min(64vw, 360px))); } }
    /* someone who has opened the app before: the word is already written, it just settles in */
    #splash.quick > svg { clip-path: none; animation: wm-quick .45s cubic-bezier(.16,1,.3,1) both; }
    #splash.quick > svg path { fill-opacity: 1; stroke-width: 0; animation: none; }
    #splash.quick > i { display: none; }
    #splash.quick { transition: opacity .3s ease, visibility .3s; }
    @keyframes wm-quick { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #splash > svg, #splash > svg path, #splash > i { animation-duration: .01s; animation-delay: 0s; } }
    /* first open of each visit: a car is drawn, checked part by part, and priced (about 3 s, CSS only, can be skipped) */
    html:not([data-intro="on"]) #intro { display: none; }
    #intro { position: absolute; inset: 0; z-index: 2; background: inherit; color: inherit; overflow: hidden;
      animation: in-wipe .55s cubic-bezier(.7,0,.3,1) 2.65s forwards; }
    #intro .stage { position: absolute; left: 50%; top: 46%; width: min(86vw, 520px); transform: translate(-50%, -50%); }
    #intro .car { display: block; width: 100%; overflow: visible; }
    #intro .ln { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 1; stroke-dashoffset: 1; animation: in-draw 1s cubic-bezier(.65,.05,.36,1) .1s forwards; }
    #intro .ln.thin { stroke-width: 1.4; opacity: .55; animation-delay: .45s; animation-duration: .7s; }
    #intro .shell { fill: currentColor; fill-opacity: 0; animation: in-shade .6s ease 1.15s forwards; }
    #intro .ground { position: absolute; left: 50%; bottom: 4%; height: 1px; width: 0; transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, currentColor, transparent); opacity: .35;
      animation: in-ground 1.1s cubic-bezier(.16,1,.3,1) .2s forwards; }
    #intro .scan { position: absolute; top: -6%; bottom: 2%; right: 0; width: 2px; background: #E3232C; opacity: 0;
      box-shadow: 0 0 14px 2px rgba(227,35,44,.55); animation: in-scan .8s cubic-bezier(.45,0,.2,1) .95s forwards; }
    #intro .scan::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 56px;
      background: linear-gradient(90deg, rgba(227,35,44,.22), transparent); }
    #intro .dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #E3232C;
      transform: scale(0); animation: in-dot .35s cubic-bezier(.34,1.56,.64,1) forwards; }
    #intro .dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px solid #E3232C;
      opacity: 0; animation: in-ring .6s ease-out forwards; animation-delay: inherit; }
    #intro .price { position: absolute; left: 0; right: 0; top: calc(100% + 26px); text-align: center; direction: ltr;
      font-family: Alexandria, system-ui, sans-serif; font-weight: 300; font-size: clamp(30px, 9vw, 52px); letter-spacing: -.01em;
      font-variant-numeric: tabular-nums; opacity: 0; counter-reset: m var(--m) k var(--k);
      animation: in-up .4s cubic-bezier(.16,1,.3,1) 1.6s forwards, in-count 1s cubic-bezier(.16,1,.3,1) 1.6s forwards; }
    #intro .price::before { content: counter(m) "," counter(k, pad3) ",000"; }
    #intro .price small { display: block; direction: rtl; font-size: 13px; font-weight: 400; opacity: .55; margin-top: 4px; }
    #intro .skip { position: absolute; bottom: max(22px, env(safe-area-inset-bottom)); left: 22px; z-index: 3;
      height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid currentColor; background: transparent; color: inherit;
      font: 500 13px Alexandria, system-ui, sans-serif; opacity: 0; cursor: pointer; animation: in-fade .4s ease .7s forwards; }
    #intro .skip { border-color: rgba(128,128,128,.4); }
    @property --m { syntax: "<integer>"; inherits: false; initial-value: 0; }
    @property --k { syntax: "<integer>"; inherits: false; initial-value: 0; }
    @counter-style pad3 { system: extends decimal; pad: 3 "0"; }
    @keyframes in-draw { to { stroke-dashoffset: 0; } }
    @keyframes in-shade { to { fill-opacity: .07; } }
    @keyframes in-ground { to { width: 130%; } }
    @keyframes in-scan { 0% { opacity: 1; right: 0; } 92% { opacity: 1; } 100% { opacity: 0; right: 100%; } }
    @keyframes in-dot { to { transform: scale(1); } }
    @keyframes in-ring { 0% { opacity: .9; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes in-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes in-count { from { --m: 0; --k: 0; } to { --m: 1; --k: 340; } }
    @keyframes in-fade { to { opacity: 1; } }
    @keyframes in-wipe { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 100% 0 0); } }
    @media (prefers-reduced-motion: reduce) { #intro { display: none !important; } }
  </style>
