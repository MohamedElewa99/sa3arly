<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>سعرلي — اعرف تمن العربية قبل ما تدفع</title>
  <meta name="description" content="سعرلي بيسعّر العربية المستعملة في مصر من الإعلانات الحقيقية وحالة الدهان والميكانيكا.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F6F7" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سعرلي">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@200;300;400;500;600&family=Aref+Ruqaa:wght@400;700&display=swap">
  <script src="/sa3-three.js" defer></script>
  <style>
    /* first paint: a plain black or white page (follows the phone's dark mode) while سعرلي writes itself */
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
      background: #000; color: #F4F4F4; transition: opacity .5s ease, visibility .5s; }
    @media (prefers-color-scheme: light) { #splash { background: #F5F6F7; color: #000; } }
    #splash.light { background: #F5F6F7; color: #000; }
    #splash.dark { background: #000; color: #F4F4F4; }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash > svg { width: min(64vw, 360px); overflow: visible; clip-path: inset(-20% 0 -20% 100%);
      animation: wm-reveal 1.5s cubic-bezier(.65,.05,.36,1) .1s forwards; }
    #splash > svg path { fill: currentColor; fill-opacity: 0; stroke: currentColor; stroke-width: 7; stroke-linejoin: round;
      animation: wm-fill .6s ease 1.1s forwards; }
    #splash > i { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #E3232C; top: 50%; right: calc(50% - min(32vw, 180px));
      opacity: 0; animation: wm-pen 1.5s cubic-bezier(.65,.05,.36,1) .1s forwards; }
    @keyframes wm-reveal { to { clip-path: inset(-20% 0 -20% 0); } }
    @keyframes wm-fill { to { fill-opacity: 1; stroke-width: 0; } }
    @keyframes wm-pen { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 90% { opacity: 1; }
      100% { opacity: 0; transform: translateX(calc(-1 * min(64vw, 360px))); } }
    /* someone who has opened the app before: the word is already written, it just settles in */
    #splash.quick > svg { clip-path: none; animation: wm-quick .45s cubic-bezier(.16,1,.3,1) both; }
    #splash.quick > svg path { fill-opacity: 1; stroke-width: 0; animation: none; }
    #splash.quick > i { display: none; }
    #splash.quick { transition: opacity .3s ease, visibility .3s; }
    @keyframes wm-quick { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #splash > svg, #splash > svg path, #splash > i { animation-duration: .01s; animation-delay: 0s; } }
    /* first open of a visit, ~3.6 s, always at night: a car comes at you with its lights on, passes, and its red
       tail light writes سعرلي like a long-exposure photo. CSS only; "تخطي" ends it; off for reduced motion. */
    html:not([data-intro="on"]) #intro { display: none; }
    #intro { position: absolute; inset: 0; z-index: 3; background: #000; color: #fff; overflow: hidden;
      animation: nx-out .5s ease 3.5s forwards; }
    #intro * { position: absolute; }
    #intro .floor { left: 0; right: 0; bottom: 0; height: 48%; opacity: 0;
      background: radial-gradient(60% 55% at 50% 0%, rgba(120,140,170,.16), transparent 70%); animation: nx-in 1s ease .1s forwards; }
    #intro .road { left: 50%; top: 56%; height: 1px; width: 0; transform: translateX(-50%); opacity: .5;
      background: linear-gradient(90deg, transparent, rgba(220,230,255,.6), transparent); animation: nx-road 1.2s cubic-bezier(.16,1,.3,1) .1s forwards; }
    /* the car coming: two lamps that grow, a blue-white anamorphic streak, their reflection on the wet floor */
    #intro .head { left: 50%; top: 52%; width: 0; height: 0; transform: scale(.12); opacity: 0;
      animation: nx-come 1.15s cubic-bezier(.55,0,.9,.4) .15s forwards, nx-pass .2s ease-in 1.3s forwards; }
    #intro .lamp { width: 46px; height: 30px; margin: -15px 0 0 -23px; border-radius: 50%;
      background: radial-gradient(closest-side, #fff 0 35%, rgba(205,225,255,.85) 55%, rgba(150,185,255,0) 100%);
      box-shadow: 0 0 40px 18px rgba(170,200,255,.35); }
    #intro .lamp.l { left: -92px; } #intro .lamp.r { left: 92px; }
    #intro .streak { left: -420px; width: 840px; height: 2px; margin-top: -1px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, rgba(160,195,255,.85) 35%, #fff 50%, rgba(160,195,255,.85) 65%, transparent); filter: blur(.6px); }
    #intro .wet { top: 120px; left: -150px; width: 300px; height: 150px; opacity: .35; filter: blur(10px);
      background: radial-gradient(18% 60% at 20% 0%, rgba(200,220,255,.9), transparent 70%), radial-gradient(18% 60% at 80% 0%, rgba(200,220,255,.9), transparent 70%); }
    #intro .flash { inset: 0; opacity: 0; background: radial-gradient(70% 60% at 50% 52%, #fff, rgba(200,220,255,.5) 40%, transparent 75%);
      animation: nx-flash .5s ease-out 1.22s forwards; }
    #intro .whoosh { left: 0; right: 0; top: 40%; height: 30%; opacity: 0; animation: nx-in .1s linear 1.3s forwards, nx-fade .4s ease 1.6s forwards; }
    #intro .whoosh i { height: 1px; width: 45%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      left: 100%; animation: nx-whoosh .45s cubic-bezier(.3,0,.2,1) 1.3s forwards; }
    /* the car going away: red tail lights that shrink toward where the word starts, then become one pen of light */
    #intro .tail { left: 50%; top: 53%; width: 0; height: 0; opacity: 0;
      animation: nx-in .08s linear 1.38s forwards, nx-away .6s cubic-bezier(.2,.7,.3,1) 1.38s forwards, nx-fade .2s ease 1.95s forwards; }
    #intro .tail b { width: 34px; height: 12px; margin: -6px 0 0 -17px; border-radius: 6px; background: #ff2a35;
      box-shadow: 0 0 18px 6px rgba(227,35,44,.75), 0 0 60px 18px rgba(227,35,44,.35); }
    #intro .tail b.l { left: -70px; } #intro .tail b.r { left: 70px; }
    #intro .word { left: 50%; top: 50%; width: min(64vw, 360px); aspect-ratio: 1812 / 1179; transform: translate(-50%, -50%); }
    /* the ink and the pen share one moving edge, so the light is always exactly where the word is being written */
    #intro .ink, #intro .track { top: 0; bottom: 0; right: 0; width: 0; animation: nx-write 1.25s cubic-bezier(.5,.1,.4,1) 1.95s forwards; }
    #intro .ink { clip-path: inset(-40% 0 -40% 0); filter: drop-shadow(0 0 10px rgba(227,35,44,.75)); }
    #intro .ink.cool { animation: nx-write 1.25s cubic-bezier(.5,.1,.4,1) 1.95s forwards, nx-cool .8s ease 3.05s forwards; }
    #intro .ink svg { top: 0; right: 0; width: min(64vw, 360px); height: 100%; overflow: visible; }
    #intro .ink path { fill: #fff; fill-opacity: 0; stroke: #ff3b45; stroke-width: 9; stroke-linejoin: round; animation: wm-fill .7s ease 2.85s forwards; }
    #intro .pen { top: 50%; left: -5px; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #fff; opacity: 0;
      box-shadow: 0 0 10px 4px #ff2a35, 0 0 34px 12px rgba(227,35,44,.6); animation: nx-in .1s linear 1.95s forwards, nx-fade .25s ease 3.12s forwards; }
    #intro .skip { left: 22px; bottom: max(22px, env(safe-area-inset-bottom)); height: 36px; padding: 0 16px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: rgba(255,255,255,.8);
      font: 500 13px Alexandria, system-ui, sans-serif; opacity: 0; cursor: pointer; animation: nx-in .4s ease .8s forwards; }
    @keyframes nx-in { to { opacity: 1; } }
    @keyframes nx-fade { to { opacity: 0; } }
    @keyframes nx-out { to { opacity: 0; visibility: hidden; } }
    @keyframes nx-road { to { width: 120%; } }
    @keyframes nx-come { 0% { opacity: 0; transform: scale(.12); } 15% { opacity: 1; } 100% { opacity: 1; transform: scale(1.7); } }
    @keyframes nx-pass { to { opacity: 0; transform: scale(4.5) translateY(10px); } }
    @keyframes nx-flash { 0% { opacity: 0; } 30% { opacity: .95; } 100% { opacity: 0; } }
    @keyframes nx-whoosh { from { transform: translateX(0); } to { transform: translateX(-260vw); } }
    @keyframes nx-away { 0% { transform: translate(0, 0) scale(1.6); } 100% { transform: translate(min(32vw, 180px), -3%) scale(.14); } }
    @keyframes nx-write { to { width: 100%; } }
    @keyframes nx-cool { to { filter: drop-shadow(0 0 3px rgba(227,35,44,.35)); } }
    @media (prefers-reduced-motion: reduce) { #intro { display: none !important; } }
  </style>
